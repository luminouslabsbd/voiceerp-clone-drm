version: "3.9"

# common env var settings
# not all containers use all of these env vars, but they are common
# enough it's much simpler to track them in one place
x-common-variables: &common-variables
  JAMBONES_MYSQL_HOST: 172.10.0.2
  JAMBONES_MYSQL_USER: jambones
  JAMBONES_MYSQL_PASSWORD: jambones
  JAMBONES_MYSQL_DATABASE: jambones
  # different servers require these env vars a little differently, but
  # probably at least the first two can be consolidated soon
  JWT_SECRET: "5a3e38b5-3188-4936-89c9-fb0df3138b5c"
  ENCRYPTION_SECRET: "5a3e38b5-3188-4936-89c9-fb0df3138b5c"
  AUTHENTICATION_KEY: "5a3e38b5-3188-4936-89c9-fb0df3138b5c"
  NODE_ENV: production
  JAMBONES_TIME_SERIES_HOST: 172.10.0.61
  ENABLE_METRICS: 0
  JAMBONES_CLUSTER_ID: jb
  JAMBONES_REDIS_HOST: 172.10.0.3
  JAMBONES_REDIS_PORT: 6379
  JAMBONES_LOGLEVEL: info
  # note that DRACHTIO_HOST is different for the feature server,
  # so we set it explicitly on the containers that need it
  DRACHTIO_PORT: 9022
  DRACHTIO_SECRET: cymru

networks:
  jambonz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.0.0/16
services:
  mysql:
    image: mysql:8.0
    volumes:
      - ./data_volume:/var/lib/mysql
      - ./mysql/create_db.sql:/docker-entrypoint-initdb.d/create_db.sql
    ports:
      - "3360:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "jambones"
      MYSQL_USER: "jambones"
      MYSQL_PASSWORD: "jambones"
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol", "tcp"]
      timeout: 5s
      retries: 10
    networks:
      jambonz:
        ipv4_address: 172.10.0.2
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "16379:6379/tcp"
    networks:
      jambonz:
        ipv4_address: 172.10.0.3
    restart: always

  drachtio-sbc:
    image: drachtio/drachtio-server:latest
    restart: always
    command:
      [
        "drachtio",
        "--contact",
        "sip:172.10.0.10;transport=udp,tcp",
        "--external-ip",
        "${HOST_IP}",
        "--address",
        "0.0.0.0",
        "--port",
        "9022",
        "--disable-nat-detection",
      ]
    volumes:
      - ./sbc/drachtio.conf.xml:/etc/drachtio.conf.xml
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    depends_on:
      - rtpengine
    networks:
      jambonz:
        ipv4_address: 172.10.0.10

  rtpengine:
    image: drachtio/rtpengine:jambonz-test
    restart: always
    command:
      [
        "rtpengine",
        "--interface",
        "private/172.10.0.11",
        "--interface",
        "public/172.10.0.11!${HOST_IP}",
        "--log-level",
        "5",
      ]
    ports:
      - "40000-40100:40000-40100/udp"
    networks:
      jambonz:
        ipv4_address: 172.10.0.11

  # api-server:
  #   image: jambonz/api-server:latest
  #   restart: always
  #   ports:
  #     - "3003:3000"
  #   environment:
  #     <<: *common-variables
  #     HTTP_PORT: 3000
  #     JAMBONZ_RECORD_WS_USERNAME: voiceerp
  #     JAMBONZ_RECORD_WS_PASSWORD: voiceerp
  #     CUSTOM_EMAIL_VENDOR_URL: https://api.resend.com/emails
  #     CUSTOM_EMAIL_VENDOR_PASSWORD: re_3Xsni8Fw_BbnbcxKCQZJDpx2otv3ZtG86
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   networks:
  #     jambonz:
  #       ipv4_address: 172.10.0.30

  api-server:
    build:
      context: ./voiceerp-api-server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3003:3000"
    environment:
      <<: *common-variables
      HTTP_PORT: 3000
      JAMBONZ_RECORD_WS_USERNAME: voiceerp
      JAMBONZ_RECORD_WS_PASSWORD: voiceerp
      CUSTOM_EMAIL_VENDOR_URL: https://api.resend.com/emails
      CUSTOM_EMAIL_VENDOR_PASSWORD: re_3Xsni8Fw_BbnbcxKCQZJDpx2otv3ZtG86
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      jambonz:
        ipv4_address: 172.10.0.30

  webapp:
    image: jambonz/webapp:latest
    networks:
      jambonz:
        ipv4_address: 172.10.0.31
    ports:
      - "3001:3001"
    environment:
      API_BASE_URL: https://api.voiceerp.com/v1
      DEV_BASE_URL: http://api.voiceerp.com/v1
    depends_on:
      - api-server
    restart: always

  registrar:
    image: jambonz/sbc-registrar:latest
    restart: always
    environment:
      <<: *common-variables
      DRACHTIO_HOST: 172.10.0.10
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      jambonz:
        ipv4_address: 172.10.0.32

  call-router:
    image: jambonz/sbc-call-router:latest
    restart: always
    environment:
      <<: *common-variables
      DOCKER_BRIDGE_IP: 172.10.0.1
      JAMBONES_NETWORK_CIDR: 172.10.0.0/16
      HTTP_PORT: 4000
      JAMBONES_INBOUND_ROUTE: 127.0.0.1:4002
      JAMBONES_OUTBOUND_ROUTE: 127.0.0.1:4003
      JAMBONZ_TAGGED_INBOUND: 1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      jambonz:
        ipv4_address: 172.10.0.33

  sbc-inbound:
    image: jambonz/sbc-inbound:latest
    restart: always
    environment:
      <<: *common-variables
      NODE_ENV: test
      DRACHTIO_HOST: 172.10.0.10
      JAMBONES_RTPENGINES: "172.10.0.11:22222"
      JAMBONES_NETWORK_CIDR: 172.10.0.0/16
      JAMBONES_FEATURE_SERVERS: 172.10.0.50:5060
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      jambonz:
        ipv4_address: 172.10.0.34

  sbc-outbound:
    image: jambonz/sbc-outbound:latest
    restart: always
    environment:
      <<: *common-variables
      DRACHTIO_HOST: 172.10.0.10
      JAMBONES_RTPENGINES: "172.10.0.11:22222"
      JAMBONES_NETWORK_CIDR: 172.10.0.0/16
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      jambonz:
        ipv4_address: 172.10.0.35

  drachtio-fs:
    image: drachtio/drachtio-server:latest
    restart: always
    command:
      [
        "drachtio",
        "--contact",
        "sip:*;transport=udp",
        "--contact",
        "sip:*;transport=tcp",
        "--address",
        "0.0.0.0",
        "--port",
        "9022",
      ]
    networks:
      jambonz:
        ipv4_address: 172.10.0.50

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    restart: always
    command:
      ["freeswitch", "--rtp-range-start", "20000", "--rtp-range-end", "20100"]
    ports:
      - "8022:8021/tcp"
    volumes:
      - ./tmpAudio:/tmp
    networks:
      jambonz:
        ipv4_address: 172.10.0.51

  feature-server:
    image: jambonz/feature-server:latest
    restart: always
    ports:
      - "3005:3000"
    volumes:
      - ./credentials:/opt/credentials
      - ./tmpAudio:/tmp
    environment:
      <<: *common-variables
      GOOGLE_APPLICATION_CREDENTIALS: /opt/credentials/gcp.json
      DRACHTIO_HOST: 172.10.0.50
      JAMBONES_NETWORK_CIDR: 172.10.0.0/16
      HTTP_PORT: 3000
      JAMBONES_SBCS: 172.10.0.10
      JAMBONES_FEATURE_SERVERS: 172.10.0.50:9022:cymru
      JAMBONES_FREESWITCH: 172.10.0.51:8021:JambonzR0ck$$
      JAMBONZ_RECORD_WS_BASE_URL: wss://api.voiceerp.com
      JAMBONZ_RECORD_WS_USERNAME: voiceerp
      JAMBONZ_RECORD_WS_PASSWORD: voiceerp
    depends_on:
      - mysql
      - redis
      - sbc-inbound
      - sbc-outbound
      - api-server
      - drachtio-fs
      - freeswitch
    networks:
      jambonz:
        ipv4_address: 172.10.0.60

  sbc-sip-sidecar:
    image: jambonz/sbc-sip-sidecar:latest
    restart: always
    environment:
      <<: *common-variables
      GOOGLE_APPLICATION_CREDENTIALS: /opt/credentials/gcp.json
      DRACHTIO_HOST: 172.10.0.10
      #DRACHTIO_PORT: 9022
      #DRACHTIO_SECRET:
      #JAMBONES_LOGLEVEL:
      #JAMBONES_MYSQL_HOST:
      #JAMBONES_MYSQL_USER:
      #JAMBONES_MYSQL_PASSWORD:
      #JAMBONES_MYSQL_DATABASE :
      #JAMBONES_MYSQL_PORT:
      #JAMBONES_MYSQL_CONNECTION_LIMIT:
      #JAMBONES_CLUSTER_ID :
      #JAMBONES_REDIS_HOST :
      #JAMBONES_REDIS_PORT :
      #JAMBONES_TIME_SERIES_HOST :
      #CHECK_EXPIRES_INTERVAL:
      #EXPIRES_INTERVAL :
      #JWT_SECRET:
    depends_on:
      - mysql
      - redis
      - sbc-inbound
      - sbc-outbound
      - api-server
      - drachtio-fs
      - freeswitch
      - feature-server
    networks:
      jambonz:
        ipv4_address: 172.10.0.80

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      jambonz:
        ipv4_address: 172.10.0.70
    restart: always

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    networks:
      jambonz:
        ipv4_address: 172.10.0.61
    restart: always
